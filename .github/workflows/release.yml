name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag must be v<semver>, got $GITHUB_REF_NAME"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$VERSION" == *-* ]]; then
            echo "Prerelease version, skipping release creation"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        if: steps.parse.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            /^## \[/ {
              if (in_section) exit
              if (index($0, heading) == 1) { in_section=1; next }
            }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG.md release notes found for version $VERSION"
            exit 1
          fi

      - name: Create release
        if: steps.parse.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file release-notes.md
